pipelines:
- id: test_pipeline_1_prometheus_up_kind_prometheus
  pipeline_id: test_pipeline_1
  pipeline_description: Pipeline for testing with test configs.
  query_id: prometheus_up
  server_id: kind_prometheus
  type: instant
  url: http://localhost:9090
  api: api/v1/query
  auth:
    type: none
  timeout: 30
  expr: up{job='kube-prometheus-stack-prometheus'}
  export_labels:
  - instance
  - job
  outputs:
  - id: csv_output
    type: csv
    file_path: output_{query_id}.csv
    include_labels: true
- id: test_pipeline_1_node_cpu_usage_one_hour_backwards_kind_prometheus
  pipeline_id: test_pipeline_1
  pipeline_description: Pipeline for testing with test configs.
  query_id: node_cpu_usage
  server_id: kind_prometheus
  range_id: one_hour_backwards
  type: range
  url: http://localhost:9090
  api: api/v1/query_range
  auth:
    type: none
  timeout: 30
  expr: node_cpu_seconds_total{job='node-exporter'}
  export_labels:
  - instance
  - job
  range:
    start: 1778893725
    end: 1778897325
    step: 15s
  outputs:
  - id: csv_output
    type: csv
    file_path: output_{query_id}.csv
    include_labels: true
