outputs:
  - id: "csv_output"
    type: "csv"
    file_path: "output_{query_id}.csv"
    include_labels: true

  - id: "json_output"
    type: "json"
    file_path: "output_{query_id}.json"
    include_labels: true

  - id: "pg_store"
    type: "postgresql"
    connection_string: "postgresql://user:password@localhost:5432/mydatabase"
    table_name: "prometheus_data"