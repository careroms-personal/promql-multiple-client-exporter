pipelines:
  - id: "<generated_by_program>"
    pipeline_id: "pipeline_1"
    pipeline_description: "Instance query pipeline"
    query_id: "query_1"
    server_id: "server_1"
    type: "instance"
    url: "http://localhost:9090"
    api: "api/v1/query"
    auth: {}
    timeout: 30
    expr: "up{job='prometheus'}"
    export_labels: ["instance", "job"]
    outputs:
      - id: "csv_output"
        type: "csv"
        file_path: "output.csv"
        include_labels: true
      - id: "pg_store"
        type: "postgresql"
        connection_string: "postgresql://user:password@localhost:5432/mydatabase"
        table_name: "prometheus_data"

  - id: "<generated_by_program>"
    pipeline_id: "pipeline_2"
    pipeline_description: "Range query pipeline"
    query_id: "query_2"
    server_id: "server_1"
    range_id: "range_1"
    type: "range"
    url: "http://localhost:9090"
    api: "api/v1/query_range"
    auth: {}
    timeout: 30
    expr: "cpu_usage_seconds_total{job='node'}"
    export_labels: ["instance", "job"]
    range:
      start: 1700000000
      end: 1700003600
      step: "15s"
    outputs:
      - id: "csv_output"
        type: "csv"
        file_path: "output.csv"
        include_labels: true
      - id: "pg_store"
        type: "postgresql"
        connection_string: "postgresql://user:password@localhost:5432/mydatabase"
        table_name: "prometheus_data"
